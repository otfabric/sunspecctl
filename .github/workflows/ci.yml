name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: ["**"]
    paths-ignore: ['**/*.md']

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.3.0
    with:
      run-govulncheck: true
      coverage-min: "90"
      fuzz-time: 10s
      codecov-name: sunspecctl
      go-versions: '["1.26", "1.27"]'
      test-exclude-regex: "/example(s)?($|/)"
      policy-version: v1.4.2
    secrets: inherit

  # The per-package coverage floor (TEST-012).
  coverage-packages:
    name: Per-package coverage
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/otfabric/*
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Configure private module access
        shell: bash
        env:
          TOKEN: ${{ secrets.OTFABRIC_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: make coverage-pkg-check
